name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Changeset Status
        if: github.head_ref != 'changeset-release/main'
        run: npx --no-install changeset status --since origin/main

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check:types

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
